# Headers every proxied request needs.
#
# The backend's connection comes from the edge, so without X-Forwarded-For
# and X-Real-IP every request in its logs appears to originate from the
# proxy's own address. X-Forwarded-Proto is how a backend knows the visitor
# arrived over HTTPS even though the hop to the backend is plain HTTP.
#
# proxy_http_version 1.1 plus an empty Connection header is what lets the
# `keepalive` directive in the upstream block actually reuse connections
# instead of opening a new TCP handshake per request.

proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
