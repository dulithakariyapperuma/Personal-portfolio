# ---------------------------------------------------------------------------
# WHY THIS IS A FILE AND NOT FOUR LINES IN THE SERVER BLOCK
#
# nginx's add_header does NOT merge across levels. A location that declares
# even one add_header of its own silently discards every add_header it would
# otherwise have inherited from the server block.
#
# So setting the security headers once at server level, and then adding
# X-Edge-Upstream inside each location, would quietly drop all the security
# headers on every route that has one — which is all of them. The config
# would look right, reload cleanly, and ship no protection at all.
#
# Including this snippet everywhere an add_header appears is the fix.
# (nginx Plus and the third-party headers-more module behave differently.)
#
# Verify after any change:
#   curl -sI localhost:8080/ | grep -i x-content-type
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff"                        always;
add_header X-Frame-Options        "SAMEORIGIN"                     always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
