# ---------------------------------------------------------------------------
# EDGE — the only container that publishes a port.
#
# It is three things at once, and the whole point of this lab is to see how
# they differ:
#
#   reverse proxy  — it terminates the visitor's connection and opens its own
#                    connection to a backend. The visitor never talks to an
#                    app container directly.
#   load balancer  — it spreads requests across a pool of identical backends.
#   router         — it decides WHICH pool a request belongs to, from the URL.
#
# Watch it work:  docker compose logs -f edge
# ---------------------------------------------------------------------------

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- Observability ------------------------------------------------------
  # $upstream_addr is the IP:port of the backend that actually served the
  # request. Tail the logs and refresh the page: you will watch it rotate.
  log_format lab '$remote_addr $status $request_method $request_uri '
                 '-> upstream=$upstream_addr '
                 'upstream_time=$upstream_response_time total=$request_time '
                 'cache=$upstream_cache_status bytes=$body_bytes_sent';
  access_log /var/log/nginx/access.log lab;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # --- Compression --------------------------------------------------------
  # gzip is built in. Brotli needs a third-party module (ngx_brotli), which is
  # why this image sticks to gzip. Compare `curl -H 'Accept-Encoding: gzip'`
  # with and without the header to see the difference on the three.js chunk.
  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml
                    application/wasm;

  # --- Rate limiting ------------------------------------------------------
  # A zone is shared memory keyed by client IP. 10 MB holds ~160k addresses.
  # The API is the expensive surface (it runs a model), so it gets a tighter
  # budget than the static site. `burst` allows a short spike; `nodelay`
  # serves the burst immediately instead of queueing it.
  limit_req_zone  $binary_remote_addr zone=api_rate:10m  rate=10r/s;
  limit_req_zone  $binary_remote_addr zone=chat_rate:10m rate=1r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_conn_status 429;

  # --- Response cache for the API ----------------------------------------
  # Search results for the same query are identical for every visitor, so the
  # edge can answer without waking a backend at all. Watch the `cache=` field
  # in the log go MISS -> HIT.
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                   max_size=100m inactive=10m use_temp_path=off;

  # --- The pools ----------------------------------------------------------
  #
  # Each `server` line is one backend. Named explicitly rather than using
  # Docker's `deploy.replicas`, because nginx open source resolves an upstream
  # hostname ONCE at startup — with replicas behind a single DNS name it would
  # pin itself to whichever container answered first and never balance.
  #
  # Balancing algorithms, swap the directive to compare:
  #   (default)     round robin  — strict rotation, ignores how busy a backend is
  #   least_conn    fewest active connections — better when responses vary in cost
  #   ip_hash       same client always lands on the same backend (sticky sessions)
  #   random two    picks two at random, takes the less loaded — cheap and surprisingly good
  #
  # max_fails / fail_timeout are PASSIVE health checks: after 2 failed
  # attempts nginx takes a backend out of rotation for 10s, then probes it
  # again with a live request. Active health checks (nginx polling /healthz on
  # a timer) are an nginx Plus feature; Traefik and HAProxy do them for free.
  upstream web_pool {
    # Without `zone`, each nginx worker keeps its OWN round-robin counter.
    # With 8 workers that means the first 8 connections all go to the first
    # backend — rotation looks broken until enough traffic arrives to average
    # out. `zone` puts the balancer state in shared memory so every worker
    # advances the same counter, and it is also what makes passive health
    # checks agree across workers instead of each one rediscovering a dead
    # backend on its own.
    zone web_pool 64k;
    server web1:8080 max_fails=2 fail_timeout=10s;
    server web2:8080 max_fails=2 fail_timeout=10s;
    server web3:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  upstream api_pool {
    zone api_pool 64k;
    least_conn;
    server api1:8081 max_fails=2 fail_timeout=10s;
    server api2:8081 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;

    limit_conn conn_per_ip 50;

    # Uploads are not a thing here; keep the attack surface small.
    client_max_body_size 1m;

    # Security headers are included per-location, not set here. See the
    # comment at the top of snippets/security-headers.conf for why — it is
    # one of the easiest ways to ship an nginx config that looks secure and
    # is not.

    # ------------------------------------------------------------------
    # ROUTE 1 — the edge's own health. Answers without touching a backend,
    # so an orchestrator can tell "proxy is up" from "app is up".
    # ------------------------------------------------------------------
    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"ok":true,"role":"edge"}';
    }

    # ------------------------------------------------------------------
    # ROUTE 2 — the chat endpoint. Streams, so buffering must be off, and
    # it is the most expensive call in the system, so it is rate limited
    # hardest. Longer read timeout because a model thinks slowly.
    # ------------------------------------------------------------------
    location = /api/chat {
      limit_req zone=chat_rate burst=3 nodelay;

      proxy_pass http://api_pool;
      include /etc/nginx/snippets/proxy-common.conf;

      # Server-sent events: never buffer, never cache, never time out early.
      proxy_buffering      off;
      proxy_cache          off;
      proxy_read_timeout   300s;

      include /etc/nginx/snippets/security-headers.conf;
      add_header X-Accel-Buffering "no" always;
      add_header X-Edge-Upstream $upstream_addr always;
    }

    # ------------------------------------------------------------------
    # ROUTE 3 — everything else under /api/. Cached at the edge, because
    # the same search query gives the same answer to everyone.
    # ------------------------------------------------------------------
    location /api/ {
      limit_req zone=api_rate burst=20 nodelay;

      proxy_pass http://api_pool;
      include /etc/nginx/snippets/proxy-common.conf;

      proxy_connect_timeout 3s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;

      proxy_cache            api_cache;
      proxy_cache_methods    GET HEAD;
      proxy_cache_key        "$request_method$request_uri";
      proxy_cache_valid      200 5m;
      proxy_cache_valid      404 30s;
      # Serve a stale answer rather than an error if every backend is down,
      # and let only ONE request rebuild the entry instead of a stampede.
      proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_lock       on;
      proxy_cache_background_update on;

      include /etc/nginx/snippets/security-headers.conf;
      add_header X-Cache-Status  $upstream_cache_status always;
      add_header X-Edge-Upstream $upstream_addr always;
    }

    # ------------------------------------------------------------------
    # ROUTE 4 — hashed build output. The filename changes whenever the
    # bytes change, so it can be cached effectively forever. This is the
    # single biggest performance lever on the whole site.
    # ------------------------------------------------------------------
    location /assets/ {
      proxy_pass http://web_pool;
      include /etc/nginx/snippets/proxy-common.conf;

      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control   "public, max-age=31536000, immutable" always;
      add_header X-Edge-Upstream $upstream_addr always;
    }

    # ------------------------------------------------------------------
    # ROUTE 5 — photographs and the 3D cortex. Big, stable, but NOT
    # content-hashed, so they get a month rather than a year, and
    # revalidation is allowed.
    # ------------------------------------------------------------------
    location ~* ^/(photography|models|brand|dck)/ {
      proxy_pass http://web_pool;
      include /etc/nginx/snippets/proxy-common.conf;

      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control   "public, max-age=2592000, stale-while-revalidate=86400" always;
      add_header X-Edge-Upstream $upstream_addr always;
    }

    # ------------------------------------------------------------------
    # ROUTE 6 — the app itself. A single-page app, so every unknown path
    # has to return index.html and let the router sort it out. index.html
    # must never be cached, or visitors keep loading last week's asset
    # filenames.
    # ------------------------------------------------------------------
    location / {
      proxy_pass http://web_pool;
      include /etc/nginx/snippets/proxy-common.conf;

      # If a backend fails mid-request, retry the next one in the pool rather
      # than handing the visitor a 502. Safe here because these are idempotent
      # GETs for static files.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 3s;

      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control   "no-cache" always;
      add_header X-Edge-Upstream $upstream_addr always;
    }
  }
}
